<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery Admin — Benson &amp; Precious</title>
<meta name="theme-color" content="#2c0a15">
<style>
:root {
  --burgundy-950: #2c0a15;
  --burgundy-800: #5c1229;
  --gold: #c9a24b;
  --cream: #fdf9f6;
  --ink: #220812;
  --border: #e4d9dd;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background: var(--burgundy-950); color: var(--cream);
}
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
h1 { font-weight: normal; font-size: 1.6rem; color: var(--gold); margin: 0 0 8px; }
.sub { color: #c9b8be; font-size: 14px; margin: 0 0 24px; }
.card {
  background: var(--cream); color: var(--ink);
  border-radius: 14px; padding: 20px; margin-bottom: 18px;
}
label { display: block; font-size: 12px; font-weight: 700; color: #66565b; margin-bottom: 6px; }
input[type="text"], input[type="password"], input[type="file"] {
  width: 100%; min-height: 42px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px; font: inherit; margin-bottom: 12px;
}
.btn {
  display: inline-block; border: none; border-radius: 8px; padding: 12px 18px;
  font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-primary { background: var(--burgundy-800); color: #fff; }
.btn-ghost { background: transparent; color: var(--burgundy-800); border: 1px solid var(--border); }
.btn:disabled { opacity: 0.55; cursor: wait; }
.status { font-size: 13px; margin-top: 10px; }
.status.ok { color: #238636; }
.status.err { color: #c62828; }
.photo-list { display: grid; gap: 12px; }
.photo-row {
  display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; align-items: center;
  background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px;
}
.photo-row img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; background: #eee; }
.photo-row .cap input { margin: 0; }
.hidden { display: none !important; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
a.link { color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Gallery Admin</h1>
      <p class="sub">Upload photos to Google Drive and set a name for each.</p>
    </div>
    <a class="link" href="index.html">View site</a>
  </div>

  <section id="loginCard" class="card">
    <label>Username</label>
    <input type="text" id="user" value="Admin" autocomplete="username">
    <label>Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button type="button" class="btn btn-primary" id="loginBtn">Log in</button>
    <p class="status" id="loginStatus"></p>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="card">
      <div class="topbar">
        <strong>Upload photo</strong>
        <button type="button" class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
      <label>Photo</label>
      <input type="file" id="file" accept="image/*">
      <label>Name / caption</label>
      <input type="text" id="caption" placeholder="e.g. First dance" maxlength="200">
      <button type="button" class="btn btn-primary" id="uploadBtn">Upload to Drive</button>
      <p class="status" id="uploadStatus"></p>
    </div>

    <div class="card">
      <strong>Published photos</strong>
      <p class="sub" style="color:#75656a;margin:8px 0 12px">Edit the name and save, or delete.</p>
      <div class="photo-list" id="photoList"></div>
      <p class="status" id="listStatus"></p>
    </div>
  </section>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzsvci6J14JeS7Rw1WNTI3W94R7Dp-zteZZst1YA5yLeFBrXJc53lzKgPPKQ1rlaWwg/exec";
const SESSION_KEY = "bp_gallery_admin";

function $(id) { return document.getElementById(id); }

function getSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; }
}
function setSession(s) { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

async function apiGet(action, params) {
  const u = new URL(API_URL);
  u.searchParams.set("action", action);
  Object.keys(params || {}).forEach(k => u.searchParams.set(k, params[k]));
  const res = await fetch(u.toString());
  return res.json();
}

async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: "POST",
    redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  return res.json();
}

function showAdmin(on) {
  $("loginCard").classList.toggle("hidden", on);
  $("adminPanel").classList.toggle("hidden", !on);
}

async function login() {
  const user = $("user").value.trim();
  const pass = $("pass").value;
  $("loginStatus").textContent = "Signing in…";
  $("loginStatus").className = "status";
  try {
    const data = await apiGet("login", { user: user, pass: pass });
    if (!data || data.status !== "success" || data.role !== "admin") {
      throw new Error((data && data.message) || "Admin only.");
    }
    setSession({ user: user, pass: pass });
    showAdmin(true);
    $("loginStatus").textContent = "";
    await loadPhotos();
  } catch (e) {
    $("loginStatus").textContent = e.message || "Login failed";
    $("loginStatus").className = "status err";
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ""));
    r.onerror = () => reject(new Error("Could not read file"));
    r.readAsDataURL(file);
  });
}

async function upload() {
  const session = getSession();
  if (!session) return;
  const file = $("file").files[0];
  const caption = $("caption").value.trim();
  if (!file) {
    $("uploadStatus").textContent = "Choose a photo first.";
    $("uploadStatus").className = "status err";
    return;
  }
  if (file.size > 7.5 * 1024 * 1024) {
    $("uploadStatus").textContent = "Image too large (max ~7.5MB).";
    $("uploadStatus").className = "status err";
    return;
  }
  $("uploadBtn").disabled = true;
  $("uploadStatus").textContent = "Uploading to Drive…";
  $("uploadStatus").className = "status";
  try {
    const dataUrl = await fileToBase64(file);
    const data = await apiPost({
      action: "uploadGalleryPhoto",
      user: session.user,
      pass: session.pass,
      caption: caption || file.name,
      fileName: file.name,
      mimeType: file.type || "image/jpeg",
      data: dataUrl
    });
    if (!data || data.status !== "success") throw new Error((data && data.message) || "Upload failed");
    $("uploadStatus").textContent = "✓ Uploaded";
    $("uploadStatus").className = "status ok";
    $("file").value = "";
    $("caption").value = "";
    await loadPhotos();
  } catch (e) {
    $("uploadStatus").textContent = "✕ " + (e.message || "Upload failed");
    $("uploadStatus").className = "status err";
  } finally {
    $("uploadBtn").disabled = false;
  }
}

async function loadPhotos() {
  $("listStatus").textContent = "Loading…";
  try {
    const data = await apiGet("listGallery");
    const photos = (data && data.photos) || [];
    const box = $("photoList");
    if (!photos.length) {
      box.innerHTML = "<p style=\"color:#75656a;font-size:14px\">No photos yet.</p>";
      $("listStatus").textContent = "";
      return;
    }
    box.innerHTML = photos.map(p => `
      <div class="photo-row" data-id="${escapeHtml(p.photoId)}">
        <img src="${escapeHtml(p.url)}" alt="">
        <div class="cap">
          <input type="text" value="${escapeHtml(p.caption || "")}" data-cap="${escapeHtml(p.photoId)}" maxlength="200">
        </div>
        <div>
          <button type="button" class="btn btn-ghost" data-save="${escapeHtml(p.photoId)}">Save</button>
          <button type="button" class="btn btn-ghost" data-del="${escapeHtml(p.photoId)}">Delete</button>
        </div>
      </div>`).join("");
    box.querySelectorAll("[data-save]").forEach(btn => {
      btn.addEventListener("click", () => saveCaption(btn.getAttribute("data-save")));
    });
    box.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => delPhoto(btn.getAttribute("data-del")));
    });
    $("listStatus").textContent = photos.length + " photo(s)";
  } catch (e) {
    $("listStatus").textContent = e.message || "Load failed";
    $("listStatus").className = "status err";
  }
}

async function saveCaption(id) {
  const session = getSession();
  const input = document.querySelector('input[data-cap="' + id + '"]');
  const caption = input ? input.value.trim() : "";
  $("listStatus").textContent = "Saving…";
  try {
    const data = await apiPost({
      action: "updateGalleryCaption",
      user: session.user,
      pass: session.pass,
      photoId: id,
      caption: caption
    });
    if (!data || data.status !== "success") throw new Error((data && data.message) || "Save failed");
    $("listStatus").textContent = "✓ Saved";
    $("listStatus").className = "status ok";
  } catch (e) {
    $("listStatus").textContent = "✕ " + (e.message || "Save failed");
    $("listStatus").className = "status err";
  }
}

async function delPhoto(id) {
  if (!confirm("Delete this photo from the gallery and Drive?")) return;
  const session = getSession();
  $("listStatus").textContent = "Deleting…";
  try {
    const data = await apiPost({
      action: "deleteGalleryPhoto",
      user: session.user,
      pass: session.pass,
      photoId: id
    });
    if (!data || data.status !== "success") throw new Error((data && data.message) || "Delete failed");
    await loadPhotos();
  } catch (e) {
    $("listStatus").textContent = "✕ " + (e.message || "Delete failed");
    $("listStatus").className = "status err";
  }
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

$("loginBtn").addEventListener("click", login);
$("uploadBtn").addEventListener("click", upload);
$("logoutBtn").addEventListener("click", () => { clearSession(); showAdmin(false); });
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

if (getSession()) {
  showAdmin(true);
  loadPhotos();
}
</script>
</body>
</html>
